<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LSG Pedidos - Acesso</title>
<style>
:root{--ink:#172033;--muted:#6f7788;--line:#e5e9f1;--primary:#1f5eff}
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;min-height:100vh;display:grid;place-items:center;color:var(--ink);padding:20px}
.card{width:min(92vw,440px);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 14px 40px rgba(0,0,0,.08)}
.mark{width:58px;height:58px;border-radius:17px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;margin-bottom:18px}
h1{margin:0 0 8px;font-size:24px}
.muted{color:var(--muted);font-size:14px;margin-bottom:18px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
.msg{margin-top:14px;padding:11px;border-radius:10px;font-size:14px;background:#f3f4f6}
.ok{background:#ecfdf5;color:#065f46}.err{background:#fef2f2;color:#991b1b}
</style>
</head>
<body>
<div class="card">
<div class="mark">LSG</div>
<h1 id="title">Acesso LSG Pedidos</h1>
<div id="subtitle" class="muted">Validando seu link...</div>
<div id="status" class="msg">Aguarde.</div>
<form id="form" style="display:none">
<label for="password">Nova senha</label>
<input id="password" type="password" minlength="8" autocomplete="new-password" required>
<label for="confirm">Confirmar nova senha</label>
<input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
<button id="saveBtn" type="submit">Salvar senha</button>
</form>
</div>
<script>
const SUPABASE_URL="https://lmumyncrigvbfspczudu.supabase.co";
const API_KEY="sb_publishable_2A6Ur8vPkKL0IEigRNN8hg_aseEENcY";
const VALID_TYPES=new Set(["recovery","invite"]);
const title=document.getElementById("title");
const subtitle=document.getElementById("subtitle");
const statusEl=document.getElementById("status");
const form=document.getElementById("form");
const saveBtn=document.getElementById("saveBtn");
let accessToken="",flowType="";
function show(msg,cls=""){statusEl.textContent=msg;statusEl.className="msg "+cls}
(function init(){
  const hash=new URLSearchParams(location.hash.slice(1));
  accessToken=hash.get("access_token")||"";
  flowType=hash.get("type")||"";
  const err=hash.get("error_description");
  if(err){show(decodeURIComponent(err.replace(/\+/g," ")),"err");return}
  if(!accessToken||!VALID_TYPES.has(flowType)){
    show("Link inválido ou expirado. Solicite um novo e-mail de acesso.","err");
    return;
  }
  if(flowType==="invite"){
    title.textContent="Criar senha de primeiro acesso";
    subtitle.textContent="Defina sua senha pessoal para entrar no LSG Pedidos.";
    saveBtn.textContent="Criar minha senha";
  }else{
    title.textContent="Redefinir senha";
    subtitle.textContent="Escolha uma nova senha para o LSG Pedidos.";
    saveBtn.textContent="Salvar nova senha";
  }
  history.replaceState(null,"",location.pathname);
  show("Link validado. Preencha sua nova senha.","ok");
  form.style.display="block";
})();
form.addEventListener("submit",async(e)=>{
  e.preventDefault();
  const password=document.getElementById("password").value;
  const confirm=document.getElementById("confirm").value;
  if(password!==confirm){show("As senhas não conferem.","err");return}
  if(password.length<8){show("Use pelo menos 8 caracteres.","err");return}
  saveBtn.disabled=true;saveBtn.textContent="Salvando...";
  try{
    const r=await fetch(SUPABASE_URL+"/auth/v1/user",{
      method:"PUT",
      headers:{
        "Content-Type":"application/json",
        "apikey":API_KEY,
        "Authorization":"Bearer "+accessToken
      },
      body:JSON.stringify({password})
    });
    if(!r.ok){
      const data=await r.json().catch(()=>({}));
      throw new Error(data.msg||data.message||"Falha ao alterar a senha");
    }
    form.style.display="none";
    show(flowType==="invite"
      ?"Senha criada com sucesso. Agora abra o LSG Pedidos e faça seu primeiro login."
      :"Senha alterada com sucesso. Volte ao LSG Pedidos e entre com a nova senha.","ok");
  }catch(err){
    show("Não foi possível salvar a senha: "+err.message,"err");
    saveBtn.disabled=false;
    saveBtn.textContent=flowType==="invite"?"Criar minha senha":"Salvar nova senha";
  }
});
</script>
</body>
</html>
