name: Audio scan

on:
  push:
    paths:
      - '.github/workflows/audio-scan.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan audio settings in game script
        shell: bash
        run: |
          python - <<'PY'
          import re, pathlib
          out=[]
          for fn in ["www/index.html","index.html"]:
              p=pathlib.Path(fn)
              if not p.exists(): continue
              s=p.read_text(encoding="utf-8",errors="ignore")
              pos=s.rfind("<script")
              tail=s[pos:] if pos>=0 else s[-180000:]
              lines=tail.splitlines()
              out.append(f"FILE: {fn} SCRIPT_START={pos} SCRIPT_LEN={len(tail)}")
              pat=re.compile(r'audio|music|arcade|bgm|gain|volume|tick|tic|victory|win|lose|game.?over|sound',re.I)
              shown=set()
              for i,line in enumerate(lines):
                  if pat.search(line):
                      a=max(0,i-3); b=min(len(lines),i+4)
                      key=(a,b)
                      if key in shown: continue
                      shown.add(key)
                      out.append(f"\n--- LINES {a+1}-{b} ---")
                      out.extend(f"{j+1}: {lines[j]}" for j in range(a,b))
              out.append(f"\nMATCH_BLOCKS={len(shown)}\n")
          pathlib.Path("audio_scan_tail.txt").write_text("\n".join(out),encoding="utf-8")
          PY
      - name: Commit scan report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio_scan_tail.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: scan game audio controls"
          git push
