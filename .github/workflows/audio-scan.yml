name: Publish PC proportion fix

on:
  push:
    paths:
      - '.github/workflows/audio-scan.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply PC proportion CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path("www/index.html")
          s = p.read_text(encoding="utf-8")
          marker = "AJUSTE ESPECÍFICO PARA PC / NOTEBOOK"
          css = base64.b64decode("").decode("utf-8")
          if marker not in s:
              pos = s.find("</style>")
              if pos < 0:
                  raise SystemExit("style closing tag not found")
              s = s[:pos] + "\n" + css + s[pos:]
              p.write_text(s, encoding="utf-8")
          PY
      - name: Commit production game
        shell: bash
        run: |
          if git diff --quiet -- www/index.html; then
            echo "PC proportion patch already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/index.html
          git commit -m "fix: adjust game proportions for PC"
          git push
