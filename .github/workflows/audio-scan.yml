name: Export updated HTML

on:
  push:
    paths:
      - '.github/workflows/audio-scan.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare downloadable HTML
        run: cp www/index.html O_GAUCHO_DESAFIO_DA_TACA_TESTE_LIBERADO.html
      - uses: actions/upload-artifact@v4
        with:
          name: O_GAUCHO_TESTE_LIBERADO
          path: O_GAUCHO_DESAFIO_DA_TACA_TESTE_LIBERADO.html
          retention-days: 1
