name: Scan test-player rules

on:
  push:
    paths:
      - '.github/workflows/audio-scan.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan ranking and player-name logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("www/index.html")
          s=p.read_text(encoding="utf-8",errors="ignore")
          pos=s.rfind("<script")
          tail=s[pos:] if pos>=0 else s
          lines=tail.splitlines()
          pat=re.compile(r'teste|validatePlayerName|playerName|ranking|rank|duplicate|duplic|jogar novamente|againBtn',re.I)
          out=[]
          for i,line in enumerate(lines):
              if pat.search(line):
                  a=max(0,i-5); b=min(len(lines),i+8)
                  out.append(f"\n--- LINES {a+1}-{b} ---")
                  out.extend(f"{j+1}: {lines[j]}" for j in range(a,b))
          Path("test_player_scan.txt").write_text("\n".join(out),encoding="utf-8")
          PY
      - name: Commit scan report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test_player_scan.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: scan test-player rules"
          git push
