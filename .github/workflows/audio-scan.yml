name: Audio scan

on:
  push:
    paths:
      - '.github/workflows/audio-scan.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan audio settings
        shell: bash
        run: |
          python - <<'PY'
          import re, pathlib
          files = [pathlib.Path("www/index.html"), pathlib.Path("index.html")]
          terms = re.compile(r'volume|gain|arcade|music|audio|bgm|sound|tick|tic', re.I)
          out = []
          for p in files:
              if not p.exists():
                  continue
              s = p.read_text(encoding="utf-8", errors="ignore")
              out.append(f"FILE: {p} SIZE={len(s)}")
              count = 0
              for m in terms.finditer(s):
                  a = max(0, m.start()-260); b = min(len(s), m.end()+360)
                  snippet = s[a:b].replace("\n","\\n").replace("\r","")
                  out.append(f"\n--- MATCH {count+1}: {m.group(0)} @ {m.start()} ---\n{snippet}")
                  count += 1
                  if count >= 250:
                      break
              out.append(f"\nTOTAL_SHOWN={count}\n")
          pathlib.Path("audio_scan.txt").write_text("\n".join(out), encoding="utf-8")
          PY
      - name: Commit scan report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio_scan.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: scan audio settings"
          git push
