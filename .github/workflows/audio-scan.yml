name: Publish PC proportion fix

on:
  push:
    paths:
      - '.github/workflows/audio-scan.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply PC proportion CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          s = p.read_text(encoding="utf-8")
          marker = "AJUSTE ESPECÍFICO PARA PC / NOTEBOOK"
          css = r"""  /* ===== AJUSTE ESPECÍFICO PARA PC / NOTEBOOK =====
     Mantém o jogo em proporção vertical semelhante ao celular,
     centralizado na tela, sem esticar garrafas, taças ou capa. */
  @media (min-width:700px){
    html,body{
      background:#130d0a;
    }
    body{
      display:flex;
      align-items:center;
      justify-content:center;
    }
    #app{
      width:min(100vw,calc(100vh * 0.5628));
      height:100vh;
      max-width:620px;
      margin:0 auto;
      box-shadow:0 0 42px rgba(0,0,0,.72);
    }

    /* A capa passa a ocupar exatamente a área vertical do jogo. */
    #cover img{object-fit:cover}

    /* Reaplica no PC as proporções visuais equivalentes ao layout móvel. */
    :root{--glass-w:82px;--bowl-h:150px}
    .topbar{width:min(100%,620px);padding-top:calc(10px + env(safe-area-inset-top))}
    .infoRow{width:min(100%,620px);gap:8px;padding:0 10px}
    .infoCard{min-height:66px;padding:8px 6px}
    .infoCard .statLabel{font-size:10px}
    .infoCard .statValue{font-size:21px}

    .bottleLine{
      top:182px;
      width:min(100%,520px);
    }
    .bgBottleSlot{height:448px}
    .bgBottle{
      height:430px !important;
      max-height:430px !important;
      width:auto !important;
      max-width:98%;
    }
    .bgBottleName{
      font-size:18px;
      bottom:-10px;
      white-space:normal;
      max-width:120px;
      line-height:1.02;
    }

    #boardWrap{padding:546px 4px 16px}
    #board{
      width:min(100%,520px);
      gap:6px 3px;
    }
    .slot{height:calc(var(--bowl-h) + 60px)}
  }

  /* Notebook mais baixo (ex.: 1366x768): reduz tudo de forma proporcional. */
  @media (min-width:700px) and (max-height:850px){
    :root{--glass-w:70px;--bowl-h:128px}
    .roundBtn{width:46px;height:46px}
    .infoRow{margin-top:7px}
    .infoCard{min-height:58px;padding:6px 5px}
    .infoCard .statValue{font-size:19px}
    .bottleLine{top:166px;width:min(100%,470px)}
    .bgBottleSlot{height:364px}
    .bgBottle{height:350px !important;max-height:350px !important}
    .bgBottleName{font-size:16px;bottom:-7px}
    #boardWrap{padding:432px 4px 12px}
    #board{width:min(100%,470px);gap:5px 3px}
    .slot{height:calc(var(--bowl-h) + 54px)}
  }

  /* Telas Full HD / monitores altos: aproveita melhor a altura sem distorcer. */
  @media (min-width:1000px) and (min-height:900px){
    :root{--glass-w:88px;--bowl-h:162px}
    .bottleLine{top:198px;width:min(100%,560px)}
    .bgBottleSlot{height:492px}
    .bgBottle{height:474px !important;max-height:474px !important}
    .bgBottleName{font-size:20px;bottom:-9px;max-width:130px}
    #boardWrap{padding:596px 6px 18px}
    #board{width:min(100%,560px);gap:8px 5px}
    .slot{height:calc(var(--bowl-h) + 62px)}
  }
"""
          if marker not in s:
              pos = s.find("</style>")
              if pos < 0:
                  raise SystemExit("style closing tag not found")
              s = s[:pos] + "\n" + css + s[pos:]
              p.write_text(s, encoding="utf-8")
          PY
      - name: Commit production game
        shell: bash
        run: |
          if git diff --quiet -- www/index.html; then
            echo "PC proportion patch already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/index.html
          git commit -m "fix: adjust game proportions for PC"
          git push
