name: Publish uploaded V44 game

on:
  push:
    paths:
      - '.game_upload/**'
      - '.github/workflows/publish-v44.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild uploaded HTML
        shell: bash
        run: |
          cat .game_upload/part_* > www/index.html
          test "$(wc -c < www/index.html)" -eq 6531059
          grep -Fq '<title>O Gaúcho — Desafio das Taças</title>' www/index.html
          grep -Fq 'id="startHotspot"' www/index.html
          grep -Fq 'id="rankingHotspot"' www/index.html
          grep -Fq 'id="howHotspot"' www/index.html
      - name: Commit production game
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: publish V44 controls-corrected game"
          git push
