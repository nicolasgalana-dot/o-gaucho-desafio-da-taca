name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Sync game into Android
        run: npx cap sync android

      - name: Apply official app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/res/values/strings.xml")
          s = p.read_text(encoding="utf-8")
          name = "O DESAFIO VINHO O GAÚCHO"
          s = re.sub(r'(<string name="app_name">).*?(</string>)', rf'\1{name}\2', s)
          s = re.sub(r'(<string name="title_activity_main">).*?(</string>)', rf'\1{name}\2', s)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Apply official Android launcher icon
        run: |
          set -e
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            rm -f "$dir"/ic_launcher.* "$dir"/ic_launcher_round.*
            cp assets/app-icon.jpg "$dir/ic_launcher.jpg"
            cp assets/app-icon.jpg "$dir/ic_launcher_round.jpg"
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Build installable debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk O-DESAFIO-VINHO-O-GAUCHO.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: O-DESAFIO-VINHO-O-GAUCHO-APK
          path: O-DESAFIO-VINHO-O-GAUCHO.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest O-DESAFIO-VINHO-O-GAUCHO.apk \
            --target "$GITHUB_SHA" \
            --title "O DESAFIO VINHO O GAÚCHO — APK mais recente" \
            --notes "APK Android instalável com novo nome e novo ícone oficial. Base do jogo: V52."
