name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Android icon tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick

      - name: Correct cover start touch area
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("www/index.html")
          s = p.read_text(encoding="utf-8")

          rule = (
              ".coverStart{position:absolute;left:50%;bottom:18.9%;"
              "transform:translateX(-50%);z-index:3;width:50%;height:6.6%;"
              "border:0;border-radius:999px;background:rgba(255,255,255,0.001);"
              "color:transparent;font-size:0;cursor:pointer;touch-action:manipulation;"
              "-webkit-tap-highlight-color:transparent;appearance:none;-webkit-appearance:none}"
          )

          s, count = re.subn(r'\.coverStart\{[^}]*\}', rule, s, count=1)
          if count != 1:
              raise SystemExit("coverStart rule not found")

          p.write_text(s, encoding="utf-8")
          print("Cover start hitbox aligned with the visible INICIAR JOGO button.")
          PY

      - name: Generate Android project
        run: npx cap add android

      - name: Sync corrected game into Android
        run: npx cap sync android

      - name: Apply official app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/res/values/strings.xml")
          s = p.read_text(encoding="utf-8")
          name = "O DESAFIO VINHO O GAÚCHO"
          s = re.sub(r'(<string name="app_name">).*?(</string>)', rf'\1{name}\2', s)
          s = re.sub(r'(<string name="title_activity_main">).*?(</string>)', rf'\1{name}\2', s)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Generate official PNG and adaptive Android icons
        run: |
          set -e
          SRC="assets/app-icon.png"

          declare -A LEGACY=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          declare -A ADAPTIVE=( [mdpi]=108 [hdpi]=162 [xhdpi]=216 [xxhdpi]=324 [xxxhdpi]=432 )

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"

            rm -f "$dir"/ic_launcher.* "$dir"/ic_launcher_round.* "$dir"/ic_launcher_foreground.*

            size="${LEGACY[$density]}"
            fg="${ADAPTIVE[$density]}"
            inner=$(( fg * 72 / 100 ))

            convert "$SRC" -auto-orient -resize "${size}x${size}^" -gravity center -extent "${size}x${size}"               "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"

            convert "$SRC" -auto-orient -resize "${inner}x${inner}^" -gravity center -extent "${inner}x${inner}"               -alpha set -background none -gravity center -extent "${fg}x${fg}"               "$dir/ic_launcher_foreground.png"
          done

          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/icon_colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#3B050A</color>
          </resources>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

      - name: Build installable debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk O-DESAFIO-VINHO-O-GAUCHO.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: O-DESAFIO-VINHO-O-GAUCHO-APK
          path: O-DESAFIO-VINHO-O-GAUCHO.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest O-DESAFIO-VINHO-O-GAUCHO.apk \
            --target "$GITHUB_SHA" \
            --title "O DESAFIO VINHO O GAÚCHO — APK mais recente" \
            --notes "APK Android instalável com ícone PNG/Adaptive Icon e área de toque do botão INICIAR JOGO corrigida. Versão do jogo: V53."
