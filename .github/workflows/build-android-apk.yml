name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Sync game into Android
        run: npx cap sync android

      - name: Build installable debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk O-Gaucho-Desafio-da-Taca.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: O-Gaucho-Desafio-da-Taca-APK
          path: O-Gaucho-Desafio-da-Taca.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest O-Gaucho-Desafio-da-Taca.apk \
            --target "$GITHUB_SHA" \
            --title "O Gaúcho — APK mais recente" \
            --notes "APK Android instalável do O Gaúcho — Desafio da Taça. Base atual: jogo V52."
